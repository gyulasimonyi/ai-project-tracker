<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Projects — Gyula Simonyi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ---------------------------------------------------------------
   Design tokens. Change a value here and it changes everywhere.
   The look is a drafting sheet: blue-black ink on cool paper,
   with one plotter-pen magenta reserved for work in progress.
----------------------------------------------------------------*/
:root {
  --paper:      #0B0F12;
  --sheet:      #12181D;
  --ink:        #E8EDF0;
  --ink-soft:   #8A99A3;
  --rule:       #2A343B;
  --signal:     #FF2B8F;
  --signal-bg:  rgba(255, 43, 143, 0.1);
  --success:    #29FF9B;
  --success-bg: rgba(41, 255, 155, 0.1);

  --display: "Bricolage Grotesque", Georgia, serif;
  --mono:    "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 28px 18px 80px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.sheet {
  position: relative;
  max-width: 780px;
  margin: 0 auto;
  padding: 44px 38px 52px;
  background: var(--sheet);
  border: 1px solid var(--rule);
}

/* Registration marks, like the corner ticks on a plotter sheet. */
.tick {
  position: absolute;
  width: 13px; height: 13px;
  border: 1px solid var(--ink);
}
.tick.tl { top: 10px;    left: 10px;    border-right: 0; border-bottom: 0; }
.tick.tr { top: 10px;    right: 10px;   border-left: 0;  border-bottom: 0; }
.tick.bl { bottom: 10px; left: 10px;    border-right: 0; border-top: 0; }
.tick.br { bottom: 10px; right: 10px;   border-left: 0;  border-top: 0; }

/* ---------------------------------------------------------------
   Header
----------------------------------------------------------------*/
.eyebrow {
  margin: 0;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

h1 {
  margin: 6px 0 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(38px, 9vw, 62px);
  line-height: 0.95;
  letter-spacing: -0.02em;
}

.meter {
  margin: 18px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  font-size: 13px;
  color: var(--ink-soft);
}
.meter b { color: var(--signal); font-weight: 600; }

.notice {
  margin: 10px 0 0;
  font-size: 12px;
  color: var(--ink-soft);
}

/* ---------------------------------------------------------------
   Section headings
----------------------------------------------------------------*/
.section-label {
  margin: 52px 0 0;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--ink);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* ---------------------------------------------------------------
   Project rows
----------------------------------------------------------------*/
.row {
  display: grid;
  grid-template-columns: 54px 1fr auto;
  gap: 0 18px;
  padding: 20px 0 20px 14px;
  margin-left: -14px;
  border-bottom: 1px solid var(--rule);
}

/* Active work gets the magenta pen: a left stroke and a tinted ground. */
.row.active {
  background: var(--signal-bg);
  box-shadow: inset 3px 0 0 var(--signal);
}

.num {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--rule);
  font-variant-numeric: tabular-nums;
}
.row.active .num { color: var(--signal); }

.title {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 21px;
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.summary {
  margin: 5px 0 0;
  font-size: 13.5px;
  color: var(--ink-soft);
}

.status {
  align-self: start;
  padding: 3px 9px;
  border: 1px solid var(--rule);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  white-space: nowrap;
}
.row.active .status {
  border-color: var(--signal);
  color: var(--signal);
}

/* Progress complete: swap the pen from magenta to green, same intensity. */
.row.complete {
  --signal: var(--success);
  --signal-bg: var(--success-bg);
}

/* ---------------------------------------------------------------
   Progress control, shown only on projects in progress
----------------------------------------------------------------*/
.progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 13px;
}

.track {
  flex: 1;
  height: 6px;
  background: rgba(232, 237, 240, 0.12);
}

.fill {
  height: 100%;
  background: var(--signal);
  transition: width 0.2s ease-out;
}

.pct {
  min-width: 42px;
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--signal);
}

.step {
  width: 24px;
  height: 24px;
  padding: 0;
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
}
.step:hover:not(:disabled) { border-color: var(--signal); color: var(--signal); }
.step:disabled { opacity: 0.3; cursor: default; }
.step:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.save-error {
  margin: 6px 0 0;
  font-size: 11.5px;
  color: var(--signal);
}

/* ---------------------------------------------------------------
   Tools list
----------------------------------------------------------------*/
.tool {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 13px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 14px;
}
.tool-note { color: var(--ink-soft); font-size: 13px; text-align: right; }
.tool.active .tool-name { color: var(--signal); font-weight: 600; }

/* ---------------------------------------------------------------
   Footer and messages
----------------------------------------------------------------*/
.foot {
  margin-top: 34px;
  font-size: 12px;
  color: var(--ink-soft);
}

.message {
  margin-top: 30px;
  padding: 18px;
  border: 1px dashed var(--rule);
  font-size: 13.5px;
  color: var(--ink-soft);
}

/* ---------------------------------------------------------------
   Entrance: rows draw in one after another, like a plotter working
   down the page. Skipped entirely if the reader prefers less motion.
----------------------------------------------------------------*/
@keyframes draw-in {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: none; }
}
.row, .tool {
  opacity: 0;
  animation: draw-in 0.45s ease-out forwards;
}

@media (prefers-reduced-motion: reduce) {
  .row, .tool { opacity: 1; animation: none; }
  .fill { transition: none; }
}

/* ---------------------------------------------------------------
   Narrow screens: the number moves above the title.
----------------------------------------------------------------*/
@media (max-width: 560px) {
  .sheet { padding: 34px 22px 40px; }
  .row {
    grid-template-columns: 1fr auto;
    gap: 0 14px;
  }
  .num { grid-column: 1; font-size: 15px; }
  .status { grid-column: 2; grid-row: 1; }
  .body { grid-column: 1 / -1; }
  .tool { flex-direction: column; gap: 2px; }
  .tool-note { text-align: left; }
}
</style>
</head>

<body>
<div class="sheet">
  <span class="tick tl"></span><span class="tick tr"></span>
  <span class="tick bl"></span><span class="tick br"></span>

  <p class="eyebrow">Personal build log</p>
  <h1>AI Learning Projects Tracker</h1>
  <p class="meter" id="meter"></p>
  <p class="notice" id="notice" hidden>Saving is unavailable right now — showing saved file values only.</p>

  <div id="content"></div>
</div>

<script>
/* ================================================================
   WHERE THE NUMBERS LIVE

   projects.json is the file record. /api/progress is the database,
   which wins whenever it has a value for a project. Clicking + or -
   updates the bar right away and posts the new value to the database.
================================================================ */

let data = null;
let dbProgress = {};
let savingAvailable = true;

/* The number actually shown: the database value if one exists, else the file. */
function progressOf(project) {
  const stored = dbProgress[project.id];
  return typeof stored === "number" ? stored : (project.progress || 0);
}

function label(status) {
  if (status === "in-progress") return "In progress";
  if (status === "done") return "Done";
  return "Queued";
}

/* A project counts as done once its bar reaches 100%, even if the file
   still lists it as in-progress — the badge and pen color follow suit. */
function isComplete(project) {
  return project.status === "in-progress" && progressOf(project) >= 100;
}

function safe(text) {
  const box = document.createElement("div");
  box.textContent = text;
  return box.innerHTML;
}

/* ---------------------------------------------------------------
   Drawing the page
----------------------------------------------------------------*/
function progressControl(project) {
  const value = progressOf(project);
  return `
    <div class="progress" data-id="${project.id}">
      <button type="button" class="step" data-step="-10"
              aria-label="Decrease ${safe(project.title)} by 10 percent"
              ${value <= 0 ? "disabled" : ""}>&minus;</button>
      <div class="track" role="progressbar" aria-valuenow="${value}"
           aria-valuemin="0" aria-valuemax="100"
           aria-label="${safe(project.title)} progress">
        <div class="fill" style="width:${value}%"></div>
      </div>
      <span class="pct">${value}%</span>
      <button type="button" class="step" data-step="10"
              aria-label="Increase ${safe(project.title)} by 10 percent"
              ${value >= 100 ? "disabled" : ""}>+</button>
    </div>
    <p class="save-error" data-error-for="${project.id}" hidden></p>`;
}

function projectRow(project, order) {
  const active = project.status === "in-progress";
  const complete = isComplete(project);
  return `
    <article class="row ${active ? "active" : ""} ${complete ? "complete" : ""}" style="animation-delay:${order * 45}ms">
      <div class="num">${String(project.id).padStart(2, "0")}</div>
      <div class="body">
        <h2 class="title">${safe(project.title)}</h2>
        <p class="summary">${safe(project.summary)}</p>
        ${active ? progressControl(project) : ""}
      </div>
      <div class="status">${complete ? "Done" : label(project.status)}</div>
    </article>`;
}

function toolRow(tool, order) {
  const active = tool.status === "in-progress";
  return `
    <div class="tool ${active ? "active" : ""}" style="animation-delay:${order * 45}ms">
      <span class="tool-name">${safe(tool.name)}</span>
      <span class="tool-note">${safe(tool.note || "")}</span>
    </div>`;
}

function render() {
  const projects = data.projects || [];
  const tools = data.tools || [];
  const active = projects.filter(p => p.status === "in-progress").length;

  document.getElementById("meter").innerHTML =
    `<b>${active} in progress</b> · ${projects.length} projects tracked`;
  document.getElementById("notice").hidden = savingAvailable;

  let order = 0;
  document.getElementById("content").innerHTML = [
    `<h2 class="section-label">Projects</h2>`,
    ...projects.map(p => projectRow(p, order++)),
    `<h2 class="section-label">Tools to try</h2>`,
    ...tools.map(t => toolRow(t, order++)),
    `<p class="foot">Last updated ${safe(data.updated || "—")}. Edit projects.json to change anything on this page.</p>`
  ].join("");
}

/* ---------------------------------------------------------------
   Reacting to a click on + or −

   The bar updates immediately, then the new value is posted to the
   database. If that post fails, the bar reverts and a brief message
   appears under it.
----------------------------------------------------------------*/
function paintControl(control, value) {
  control.querySelector(".fill").style.width = value + "%";
  control.querySelector(".pct").textContent = value + "%";
  control.querySelector(".track").setAttribute("aria-valuenow", value);
  control.querySelector('[data-step="-10"]').disabled = value <= 0;
  control.querySelector('[data-step="10"]').disabled = value >= 100;

  const row = control.closest(".row");
  const complete = value >= 100;
  row.classList.toggle("complete", complete);
  row.querySelector(".status").textContent = complete ? "Done" : "In progress";
}

function showSaveError(id) {
  const note = document.querySelector(`.save-error[data-error-for="${id}"]`);
  if (!note) return;
  note.textContent = "Could not save — try again.";
  note.hidden = false;
  clearTimeout(note._timer);
  note._timer = setTimeout(() => { note.hidden = true; }, 3000);
}

async function adjust(id, step) {
  const project = data.projects.find(p => p.id === id);
  if (!project) return;

  const previous = progressOf(project);
  const next = Math.min(100, Math.max(0, previous + step));
  if (next === previous) return;

  const control = document.querySelector(`.progress[data-id="${id}"]`);
  paintControl(control, next);
  dbProgress[id] = next;

  try {
    const response = await fetch("/api/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, percent: next })
    });
    if (!response.ok) throw new Error("save failed");
  } catch {
    dbProgress[id] = previous;
    paintControl(control, previous);
    showSaveError(id);
  }
}

document.getElementById("content").addEventListener("click", event => {
  const button = event.target.closest(".step");
  if (!button) return;
  const id = Number(button.closest(".progress").dataset.id);
  adjust(id, Number(button.dataset.step));
});

/* ---------------------------------------------------------------
   Start: fetch the project file and the saved progress in parallel
----------------------------------------------------------------*/
const projectsRequest = fetch("projects.json")
  .then(response => {
    if (!response.ok) throw new Error("projects.json responded " + response.status);
    return response.json();
  });

const progressRequest = fetch("/api/progress")
  .then(response => {
    if (!response.ok) throw new Error("progress API responded " + response.status);
    return response.json();
  })
  .catch(() => {
    savingAvailable = false;
    return {};
  });

Promise.all([projectsRequest, progressRequest])
  .then(([loadedData, loadedProgress]) => {
    data = loadedData;
    dbProgress = loadedProgress;
    render();
  })
  .catch(error => {
    document.getElementById("content").innerHTML =
      `<div class="message">Could not load projects.json — ${safe(error.message)}.
       Check that the file sits in the same folder as this page and that its
       punctuation is valid JSON.</div>`;
  });
</script>
</body>
</html>
